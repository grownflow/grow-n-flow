services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=aquaponics_dev
      - FRONTEND_ORIGIN=http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./FlowFarmFrontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    volumes:
      - ./FlowFarmFrontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
